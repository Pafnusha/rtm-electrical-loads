name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct JS from payload chunks
        run: |
          set -euo pipefail
          reconstruct() {
            local prefix="$1"
            local out="$2"
            local dir=js/payload
            local tmp
            tmp=$(mktemp)
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              tr -d '\n' < "$dir/$name" >> "$tmp"
            done < "$dir/${prefix}.manifest"
            base64 -d "$tmp" > "$out"
            rm -f "$tmp"
            echo "Wrote $out ($(wc -c < "$out") bytes)"
          }
          reconstruct excel js/excel-export.js
          reconstruct app js/app.js
          # payload not needed on Pages site
          rm -rf js/payload
          test -s js/excel-export.js
          test -s js/app.js
          test -s js/kr-table.js
          ls -la js/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
